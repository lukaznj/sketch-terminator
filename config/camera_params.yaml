# usb_cam driver settings.
#
# video_device is the one thing you will almost certainly have to change:
# run `v4l2-ctl --list-devices` to find the right node for your camera.

/**:
    ros__parameters:
      video_device: "/dev/video0"
      framerate: 30.0
      io_method: "mmap"
      frame_id: "camera"
      # See usb_cam/supported_formats for the full list.
      pixel_format: "mjpeg2rgb"
      av_device_format: "YUV422P"
      image_width: 640
      image_height: 480
      camera_name: "camera"
      camera_info_url: "package://sketch_terminator/config/camera_calibration_params.yaml"

      # -1 means "leave the camera's own default alone".
      brightness: -1
      contrast: -1
      saturation: -1
      sharpness: -1
      gain: -1
      auto_white_balance: true
      white_balance: 4000
      autoexposure: true
      exposure: 100
      # Autofocus off: the camera is at a fixed height, and refocusing mid-run
      # would silently invalidate the calibration.
      autofocus: false
      focus: -1
